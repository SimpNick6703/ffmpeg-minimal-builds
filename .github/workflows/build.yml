name: Build Minimal FFmpeg

on:
  schedule:
    - cron: '30 6 * * 0' # Weekly Sunday 12:00 PM IST (06:30 UTC)
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: 'Override FFmpeg tag (e.g. n7.1, n8.0). Leave blank for auto-detect.'
        required: false
        type: string
      release_revision:
        description: 'Optional revision (e.g. r3). Leave blank to use the next free revision automatically.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-version:
    name: Check Latest FFmpeg Version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      ffmpeg_tag: ${{ steps.check.outputs.ffmpeg_tag }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_name: ${{ steps.check.outputs.release_name }}
    steps:
      - name: Detect Latest Tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          TAG_INPUT: ${{ inputs.ffmpeg_tag }}
          REV: ${{ inputs.release_revision }}
        run: |
          set -euo pipefail

          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG=$(git ls-remote --tags https://git.ffmpeg.org/ffmpeg.git \
              | grep -oP 'refs/tags/\Kn[0-9]+(\.[0-9]+)+$' \
              | sort -V | tail -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Failed to resolve FFmpeg tag"
            exit 1
          fi
          if [ -n "$REV" ] && ! [[ "$REV" =~ ^r[0-9]+$ ]]; then
            echo "::error::release_revision must look like r2, r3, ... (got '$REV')"
            exit 1
          fi

          # Existing releases of this FFmpeg version: ffmpeg-<tag> and ffmpeg-<tag>-r<N>
          BASE="ffmpeg-${TAG}"
          BASE_RE=$(printf '%s' "$BASE" | sed 's/[.]/[.]/g')
          EXISTING=$(gh api "repos/${REPO}/releases" --paginate --jq '.[].tag_name' \
            | grep -E "^${BASE_RE}(-r[0-9]+)?$" || true)

          SHOULD_BUILD=true
          if [ "$EVENT" = "schedule" ]; then
            # Scheduled runs only publish FFmpeg versions that were never released.
            RELEASE_TAG="$BASE"
            if [ -n "$EXISTING" ]; then
              echo "FFmpeg ${TAG} is already released. Skipping rebuild."
              SHOULD_BUILD=false
            fi
          elif [ -n "$REV" ]; then
            RELEASE_TAG="${BASE}-${REV}"
            if printf '%s\n' "$EXISTING" | grep -qx "$RELEASE_TAG"; then
              echo "::error::${RELEASE_TAG} already exists. Use a higher revision or leave it blank."
              exit 1
            fi
          elif [ -z "$EXISTING" ]; then
            RELEASE_TAG="$BASE"
          else
            # Manual rebuild of a released version: next free revision (base counts as r1).
            LAST=$(printf '%s\n' "$EXISTING" | sed -nE 's/.*-r([0-9]+)$/\1/p' | sort -n | tail -1)
            RELEASE_TAG="${BASE}-r$(( ${LAST:-1} + 1 ))"
          fi

          REVISION="${RELEASE_TAG#"$BASE"}"
          echo "ffmpeg_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=Minimal FFmpeg ${TAG}${REVISION:+ (${REVISION#-})}" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${RELEASE_TAG} (build: ${SHOULD_BUILD})"

  build-linux:
    name: Build Linux x86_64
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm cmake libva-dev libdrm-dev zlib1g-dev upx-ucl pkg-config git clang

      - name: Build ffnvcodec Headers
        run: |
          mkdir -p "$GITHUB_WORKSPACE/local"
          git clone --depth 1 https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
          cd nv-codec-headers
          make install PREFIX="$GITHUB_WORKSPACE/local"
          cd ..

      - name: Build static x264
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --prefix="$GITHUB_WORKSPACE/local" --enable-static --enable-pic --disable-cli --disable-opencl
          make -j$(nproc)
          make install
          cd ..

      - name: Build static x265
        run: |
          git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git
          cd x265_git/build/linux
          cmake -G "Unix Makefiles" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/local" -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_LIBNUMA=OFF ../../source
          make -j$(nproc)
          make install
          mkdir -p "$GITHUB_WORKSPACE/local/lib/pkgconfig"
          cat << EOF > "$GITHUB_WORKSPACE/local/lib/pkgconfig/x265.pc"
          prefix=$GITHUB_WORKSPACE/local
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: x265
          Description: H.265/HEVC video encoder
          Version: 4.1
          Libs: -L\${libdir} -lx265
          Libs.private: -lstdc++ -lm -ldl -lpthread
          Cflags: -I\${includedir}
          EOF
          cd ../../..

      - name: Build Minimal FFmpeg
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          TAG="${{ needs.check-version.outputs.ffmpeg_tag }}"
          git clone --depth 1 --branch "$TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$GITHUB_WORKSPACE/local/include -O3" \
            --extra-ldflags="-L$GITHUB_WORKSPACE/local/lib" \
            --extra-libs="-lstdc++ -lm -ldl -lpthread" \
            --disable-shared \
            --enable-static \
            --disable-everything \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-autodetect \
            --enable-small \
            --enable-pthreads \
            --enable-gpl \
            --enable-version3 \
            --enable-zlib \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-avdevice \
            --enable-swscale \
            --enable-swresample \
            --enable-libx264 \
            --enable-libx265 \
            --enable-cuda \
            --enable-nvenc \
            --enable-nvdec \
            --enable-ffnvcodec \
            --enable-cuda-llvm \
            --enable-vaapi \
            --enable-libdrm \
            --enable-hwaccel=h264_nvdec,hevc_nvdec,h264_vaapi,hevc_vaapi \
            --enable-filter=fps,scale,format,hwupload,hwupload_cuda,hwdownload,hwmap,null,color,scale_cuda,scale_vaapi,aresample,aformat,anull \
            --enable-indev=lavfi \
            --enable-demuxer=mov,matroska,avi,flv,concat,rawvideo \
            --enable-muxer=mp4,matroska,null,rawvideo \
            --enable-parser=h264,hevc,aac,opus,ac3 \
            --enable-decoder=h264,hevc,vp9,mjpeg,mpeg4,aac,mp3,opus,flac,vorbis,ac3,eac3,pcm_s16le,pcm_s24le,pcm_f32le,rawvideo,wrapped_avframe \
            --enable-encoder=libx264,libx265,h264_nvenc,hevc_nvenc,h264_vaapi,hevc_vaapi,rawvideo,wrapped_avframe,aac \
            --enable-bsf=aac_adtstoasc,extract_extradata,h264_mp4toannexb,null \
            --enable-protocol=file,pipe
          make -j$(nproc)
          strip ffmpeg ffprobe
          upx --best ffmpeg ffprobe || true

          # License texts and exact source revisions (GPL corresponding source)
          mkdir -p licenses
          cp COPYING.GPLv3 licenses/FFmpeg-COPYING.GPLv3
          cp COPYING.GPLv2 licenses/FFmpeg-COPYING.GPLv2
          cp LICENSE.md licenses/FFmpeg-LICENSE.md
          cp ../x264/COPYING licenses/x264-COPYING
          cp ../x265_git/COPYING licenses/x265-COPYING
          sed -n '1,/\*\//p' ../nv-codec-headers/include/ffnvcodec/nvEncodeAPI.h > licenses/nv-codec-headers-LICENSE.txt
          {
            echo "ffmpeg-minimal-builds ${RELEASE_TAG} (linux-x86_64)"
            echo "Built by: ${RUN_URL}"
            echo "Build recipe: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "License: GPL-3.0-or-later (--enable-gpl --enable-version3); license texts in licenses/"
            echo
            echo "Sources:"
            echo "  FFmpeg ${TAG}: https://github.com/FFmpeg/FFmpeg/commit/$(git rev-parse HEAD)"
            echo "  x264: https://code.videolan.org/videolan/x264/-/commit/$(git -C ../x264 rev-parse HEAD)"
            echo "  x265: https://bitbucket.org/multicoreware/x265_git/commits/$(git -C ../x265_git rev-parse HEAD)"
            echo "  nv-codec-headers: https://git.videolan.org/?p=ffmpeg/nv-codec-headers.git;a=commit;h=$(git -C ../nv-codec-headers rev-parse HEAD)"
            echo "  Ubuntu packages: $(dpkg-query -W -f='${Package} ${Version}; ' libva-dev libdrm-dev zlib1g-dev)"
            echo
            ./ffmpeg -hide_banner -buildconf
          } > BUILD_INFO.txt
          tar -czf ../ffmpeg-minimal-linux-x86_64.tar.gz ffmpeg ffprobe BUILD_INFO.txt licenses

      - name: Verify Required Filters
        working-directory: ffmpeg-src
        run: |
          REQUIRED="scale_cuda hwupload_cuda scale_vaapi hwupload fps"
          FILTERS=$(./ffmpeg -hide_banner -filters)
          MISSING=""
          for f in $REQUIRED; do
            if ! echo "$FILTERS" | awk -v f="$f" '$2 == f { found = 1 } END { exit !found }'; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required filters:$MISSING"
            exit 1
          fi
          echo "All required filters present: $REQUIRED"
          if ! ./ffmpeg -hide_banner -bsfs | tr -d '\r' | grep -qx h264_mp4toannexb; then
            echo "::error::Missing required bitstream filter: h264_mp4toannexb"
            exit 1
          fi
          {
            echo "### Binary sizes"
            echo "| File | Bytes |"
            echo "|:---|---:|"
            echo "| ffmpeg | $(stat -c%s ffmpeg) |"
            echo "| ffprobe | $(stat -c%s ffprobe) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-minimal-linux-x86_64
          path: ffmpeg-minimal-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x86_64
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            nasm
            yasm
            pkgconf
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-x265
            upx
            zip

      - name: Build Dependencies and FFmpeg in MSYS2
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig:$PKG_CONFIG_PATH"

          # 1. nv-codec-headers
          git clone --depth 1 https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
          cd nv-codec-headers
          make install PREFIX=/ucrt64
          cd ..

          # 2. AMF Headers
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git
          mkdir -p /ucrt64/include/AMF
          cp -r AMF/amf/public/include/* /ucrt64/include/AMF/

          # 3. Sanitize MSYS2 pkgconfig and libraries for pure static linkage
          sed -i 's/-lgcc_s//g; s/-lgcc//g' /ucrt64/lib/pkgconfig/*.pc || true
          rm -f /ucrt64/lib/libx264.dll.a /ucrt64/lib/libx265.dll.a /ucrt64/lib/libvpl.dll.a /ucrt64/lib/libz.dll.a

          # 4. Build Minimal FFmpeg
          TAG="${{ needs.check-version.outputs.ffmpeg_tag }}"
          git clone --depth 1 --branch "$TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --target-os=mingw64 \
            --arch=x86_64 \
            --pkg-config-flags="--static" \
            --extra-cflags="-O3" \
            --extra-ldflags="-static -static-libgcc -static-libstdc++" \
            --extra-libs="-lstdc++ -lm -lpthread" \
            --disable-shared \
            --enable-static \
            --disable-everything \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-autodetect \
            --enable-small \
            --enable-w32threads \
            --enable-gpl \
            --enable-version3 \
            --enable-zlib \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-avdevice \
            --enable-swscale \
            --enable-swresample \
            --enable-libx264 \
            --enable-libx265 \
            --enable-cuda \
            --enable-nvenc \
            --enable-nvdec \
            --enable-ffnvcodec \
            --enable-cuda-llvm \
            --enable-amf \
            --enable-libvpl \
            --enable-d3d11va \
            --enable-dxva2 \
            --enable-hwaccel=h264_nvdec,hevc_nvdec,h264_d3d11va,hevc_d3d11va,h264_dxva2,hevc_dxva2 \
            --enable-filter=fps,scale,format,hwupload,hwupload_cuda,hwdownload,hwmap,null,color,scale_cuda,scale_qsv,vpp_qsv,vpp_amf,aresample,aformat,anull \
            --enable-indev=lavfi \
            --enable-demuxer=mov,matroska,avi,flv,concat,rawvideo \
            --enable-muxer=mp4,matroska,null,rawvideo \
            --enable-parser=h264,hevc,aac,opus,ac3 \
            --enable-decoder=h264,hevc,vp9,mjpeg,mpeg4,aac,mp3,opus,flac,vorbis,ac3,eac3,pcm_s16le,pcm_s24le,pcm_f32le,rawvideo,wrapped_avframe \
            --enable-encoder=libx264,libx265,h264_nvenc,hevc_nvenc,h264_amf,hevc_amf,h264_qsv,hevc_qsv,rawvideo,wrapped_avframe,aac \
            --enable-bsf=aac_adtstoasc,extract_extradata,h264_mp4toannexb,null \
            --enable-protocol=file,pipe
          make -j$(nproc)
          strip ffmpeg.exe ffprobe.exe

          # License texts and exact source revisions (GPL corresponding source)
          mkdir -p licenses
          cp COPYING.GPLv3 licenses/FFmpeg-COPYING.GPLv3
          cp COPYING.GPLv2 licenses/FFmpeg-COPYING.GPLv2
          cp LICENSE.md licenses/FFmpeg-LICENSE.md
          sed -n '1,/\*\//p' ../nv-codec-headers/include/ffnvcodec/nvEncodeAPI.h > licenses/nv-codec-headers-LICENSE.txt
          cp ../AMF/LICENSE.txt licenses/AMF-LICENSE.txt
          for pkg in x264 x265 libvpl zlib; do
            for f in /ucrt64/share/licenses/"$pkg"/*; do
              if [ -f "$f" ]; then cp "$f" "licenses/${pkg}-$(basename "$f")"; fi
            done
          done
          {
            echo "ffmpeg-minimal-builds ${RELEASE_TAG} (win-x86_64)"
            echo "Built by: ${RUN_URL}"
            echo "Build recipe: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "License: GPL-3.0-or-later (--enable-gpl --enable-version3); license texts in licenses/"
            echo
            echo "Sources:"
            echo "  FFmpeg ${TAG}: https://github.com/FFmpeg/FFmpeg/commit/$(git rev-parse HEAD)"
            echo "  nv-codec-headers: https://git.videolan.org/?p=ffmpeg/nv-codec-headers.git;a=commit;h=$(git -C ../nv-codec-headers rev-parse HEAD)"
            echo "  AMF headers: https://github.com/GPUOpen-LibrariesAndSDKs/AMF/commit/$(git -C ../AMF rev-parse HEAD)"
            echo "  MSYS2 UCRT64 packages (sources: https://github.com/msys2/MINGW-packages, https://repo.msys2.org/mingw/sources/):"
            pacman -Q mingw-w64-ucrt-x86_64-x264 mingw-w64-ucrt-x86_64-x265 mingw-w64-ucrt-x86_64-libvpl mingw-w64-ucrt-x86_64-zlib | sed 's/^/    /'
            echo
            ./ffmpeg.exe -hide_banner -buildconf
          } > BUILD_INFO.txt
          zip -r ../ffmpeg-minimal-win-x86_64.zip ffmpeg.exe ffprobe.exe BUILD_INFO.txt licenses

      - name: Verify Required Filters
        shell: msys2 {0}
        working-directory: ffmpeg-src
        run: |
          REQUIRED="scale_cuda hwupload_cuda vpp_amf vpp_qsv hwmap hwupload fps"
          FILTERS=$(./ffmpeg.exe -hide_banner -filters)
          MISSING=""
          for f in $REQUIRED; do
            if ! echo "$FILTERS" | awk -v f="$f" '$2 == f { found = 1 } END { exit !found }'; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required filters:$MISSING"
            exit 1
          fi
          echo "All required filters present: $REQUIRED"
          if ! ./ffmpeg.exe -hide_banner -bsfs | tr -d '\r' | grep -qx h264_mp4toannexb; then
            echo "::error::Missing required bitstream filter: h264_mp4toannexb"
            exit 1
          fi
          {
            echo "### Binary sizes"
            echo "| File | Bytes |"
            echo "|:---|---:|"
            echo "| ffmpeg.exe | $(stat -c%s ffmpeg.exe) |"
            echo "| ffprobe.exe | $(stat -c%s ffprobe.exe) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-minimal-win-x86_64
          path: ffmpeg-minimal-win-x86_64.zip

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Build Dependencies
        run: brew install nasm yasm pkg-config cmake

      - name: Build Static libx264
        run: |
          mkdir -p "$GITHUB_WORKSPACE/local"
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --prefix="$GITHUB_WORKSPACE/local" --enable-static --enable-pic --disable-cli --disable-opencl
          make -j$(sysctl -n hw.logicalcpu)
          make install
          cd ..

      - name: Build Static libx265
        run: |
          git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git
          cd x265_git/build/linux
          cmake -G "Unix Makefiles" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/local" -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_LIBNUMA=OFF ../../source
          make -j$(sysctl -n hw.logicalcpu)
          make install
          mkdir -p "$GITHUB_WORKSPACE/local/lib/pkgconfig"
          cat << EOF > "$GITHUB_WORKSPACE/local/lib/pkgconfig/x265.pc"
          prefix=$GITHUB_WORKSPACE/local
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: x265
          Description: H.265/HEVC video encoder
          Version: 4.1
          Libs: -L\${libdir} -lx265
          Libs.private: -lc++ -lm -lpthread
          Cflags: -I\${includedir}
          EOF
          cd ../../..

      - name: Build Minimal FFmpeg
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          TAG="${{ needs.check-version.outputs.ffmpeg_tag }}"
          git clone --depth 1 --branch "$TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$GITHUB_WORKSPACE/local/include -O3" \
            --extra-ldflags="-L$GITHUB_WORKSPACE/local/lib" \
            --extra-libs="-lc++ -lpthread -lm" \
            --disable-shared \
            --enable-static \
            --disable-everything \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-autodetect \
            --enable-small \
            --enable-pthreads \
            --enable-gpl \
            --enable-version3 \
            --enable-zlib \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-avdevice \
            --enable-swscale \
            --enable-swresample \
            --enable-libx264 \
            --enable-libx265 \
            --enable-videotoolbox \
            --enable-audiotoolbox \
            --enable-hwaccel=h264_videotoolbox,hevc_videotoolbox \
            --enable-filter=fps,scale,format,hwupload,hwdownload,hwmap,null,color,scale_vt,aresample,aformat,anull \
            --enable-indev=lavfi \
            --enable-demuxer=mov,matroska,avi,flv,concat,rawvideo \
            --enable-muxer=mp4,matroska,null,rawvideo \
            --enable-parser=h264,hevc,aac,opus,ac3 \
            --enable-decoder=h264,hevc,vp9,mjpeg,mpeg4,aac,mp3,opus,flac,vorbis,ac3,eac3,pcm_s16le,pcm_s24le,pcm_f32le,rawvideo,wrapped_avframe \
            --enable-encoder=libx264,libx265,h264_videotoolbox,hevc_videotoolbox,rawvideo,wrapped_avframe,aac \
            --enable-bsf=aac_adtstoasc,extract_extradata,h264_mp4toannexb,null \
            --enable-protocol=file,pipe
          make -j$(sysctl -n hw.logicalcpu)
          strip ffmpeg ffprobe

          # License texts and exact source revisions (GPL corresponding source)
          mkdir -p licenses
          cp COPYING.GPLv3 licenses/FFmpeg-COPYING.GPLv3
          cp COPYING.GPLv2 licenses/FFmpeg-COPYING.GPLv2
          cp LICENSE.md licenses/FFmpeg-LICENSE.md
          cp ../x264/COPYING licenses/x264-COPYING
          cp ../x265_git/COPYING licenses/x265-COPYING
          {
            echo "ffmpeg-minimal-builds ${RELEASE_TAG} (macos-${{ matrix.arch }})"
            echo "Built by: ${RUN_URL}"
            echo "Build recipe: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "License: GPL-3.0-or-later (--enable-gpl --enable-version3); license texts in licenses/"
            echo
            echo "Sources:"
            echo "  FFmpeg ${TAG}: https://github.com/FFmpeg/FFmpeg/commit/$(git rev-parse HEAD)"
            echo "  x264: https://code.videolan.org/videolan/x264/-/commit/$(git -C ../x264 rev-parse HEAD)"
            echo "  x265: https://bitbucket.org/multicoreware/x265_git/commits/$(git -C ../x265_git rev-parse HEAD)"
            echo
            ./ffmpeg -hide_banner -buildconf
          } > BUILD_INFO.txt
          tar -czf ../ffmpeg-minimal-macos-${{ matrix.arch }}.tar.gz ffmpeg ffprobe BUILD_INFO.txt licenses

      - name: Verify Required Filters
        working-directory: ffmpeg-src
        run: |
          REQUIRED="scale_vt hwupload fps"
          FILTERS=$(./ffmpeg -hide_banner -filters)
          MISSING=""
          for f in $REQUIRED; do
            if ! echo "$FILTERS" | awk -v f="$f" '$2 == f { found = 1 } END { exit !found }'; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required filters:$MISSING"
            exit 1
          fi
          echo "All required filters present: $REQUIRED"
          if ! ./ffmpeg -hide_banner -bsfs | tr -d '\r' | grep -qx h264_mp4toannexb; then
            echo "::error::Missing required bitstream filter: h264_mp4toannexb"
            exit 1
          fi
          {
            echo "### Binary sizes"
            echo "| File | Bytes |"
            echo "|:---|---:|"
            echo "| ffmpeg | $(stat -f%z ffmpeg) |"
            echo "| ffprobe | $(stat -f%z ffprobe) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-minimal-macos-${{ matrix.arch }}
          path: ffmpeg-minimal-macos-${{ matrix.arch }}.tar.gz

  create-release:
    name: Publish Release
    needs: [check-version, build-linux, build-windows, build-macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.release_tag }}
          name: ${{ needs.check-version.outputs.release_name }}
          body: |
            Automated minimal static build of FFmpeg `${{ needs.check-version.outputs.ffmpeg_tag }}`.
            
            - **Linux x86_64**: VA-API + `scale_vaapi`, NVENC + `scale_cuda`, x264, x265
            - **Windows x86_64**: NVENC + `scale_cuda`, AMF + `vpp_amf`, QSV (oneVPL) + `vpp_qsv`, x264, x265
            - **macOS (arm64 & x86_64)**: VideoToolbox + `scale_vt`, AudioToolbox, x264, x265
          files: release-assets/*
          draft: false
          prerelease: false
